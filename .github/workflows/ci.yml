name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # GitHub deprecó el runtime Node 20 de las JS actions; las forzamos a Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    # Dummy values so `next build` page-collection succeeds in CI.
    # Real values are provided via repo/environment secrets on deploy.
    env:
      JWT_ACCESS_SECRET: dummy-ci-secret
      JWT_REFRESH_SECRET: dummy-ci-secret
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
