name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # GitHub deprecó el runtime Node 20 de las JS actions; las forzamos a Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    # Dummy values so `next build` page-collection succeeds in CI.
    # Real values are provided via repo/environment secrets on deploy.
    env:
      JWT_ACCESS_SECRET: dummy-ci-secret
      JWT_REFRESH_SECRET: dummy-ci-secret
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # PLAN-071 §4 — Valida las operaciones GraphQL contra el schema real.
      # TypeScript no ve dentro de los template literals y los tests mockean
      # Apollo, asi que sin esto un campo inexistente pasa todos los gates.
      - name: GraphQL contract check
        run: pnpm gql:check
      - run: pnpm test --coverage
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: dummy-ci-secret
      JWT_REFRESH_SECRET: dummy-ci-secret
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
